<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc"><title id="title">Keeping a character consistent across scenes</title><desc id="desc">Input photos and story characters become saved reference anchors. Each scene uses the same identity information. A selected illustration can be retried while retaining those anchors.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#cba575"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f3ecdf}.small{font-size:12px;fill:#b8aea0}.label{font-size:11px;fill:#d9b382}.heading{font-size:17px;font-weight:600}.node{fill:#2b251e;stroke:#62513f;stroke-width:1}.flow{fill:none;stroke:#cba575;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke-dasharray:4 4}</style><rect width="1120" height="340" fill="#211d18"/><text class="label" x="32" y="30">A CLOSER LOOK / CHARACTER CONSISTENCY</text><rect class="node" x="32" y="75" width="208" height="88" rx="5"/><text class="heading" x="49" y="103">Inputs</text><text class="small" x="49" y="125">Pet photos + descriptions</text><text class="small" x="49" y="142">Story and supporting cast</text><rect class="node" x="310" y="75" width="224" height="88" rx="5" style="stroke:#d9b382;fill:#3b3022"/><text class="heading" x="327" y="103">Character anchors</text><text class="small" x="327" y="125">Descriptions + reference images</text><text class="small" x="327" y="142">Saved for reuse</text><rect class="node" x="604" y="75" width="212" height="88" rx="5"/><text class="heading" x="621" y="103">Scene prompts</text><text class="small" x="621" y="125">Scene action and setting</text><text class="small" x="621" y="142">Relevant characters only</text><rect class="node" x="882" y="75" width="205" height="88" rx="5"/><text class="heading" x="899" y="103">Illustrations</text><text class="small" x="899" y="125">A coherent set of pages</text><text class="small" x="899" y="142">Review individual results</text><path class="flow" d="M240 119H310"/><path class="flow" d="M534 119H604"/><path class="flow" d="M816 119H882"/><path class="flow" d="M985 163V241H710V163"/><text class="label" x="782" y="230">retry the selected scene</text><path class="flow return" d="M421 163V241H650"/><text class="label" x="436" y="228">reuse the same identity</text><text class="small" x="32" y="295">Iteration focused on drift, extra characters, reference quality, and retries that preserve the chosen character.</text></svg>