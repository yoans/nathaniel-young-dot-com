<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Varimuse: comparison and branching architecture</title><desc id="desc">A brief and settings create a comparison plan. Inngest distributes generation to model adapters. PostgreSQL stores state and relationships, while R2 stores artwork. A comparison gallery leads to a saved Pick and a new branch that returns to the plan.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c1b4fb"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4eee4}.small{font-size:12px;fill:#bab0a2}.label{font-size:11px;fill:#c1b4fb}.heading{font-size:17px;font-weight:600}.node{fill:#29262f;stroke:#61556e;stroke-width:1}.flow{fill:none;stroke:#b4a2d9;stroke-width:1.6;marker-end:url(#arrow)}</style><rect width="1120" height="680" fill="#211d24"/><text class="label" x="32" y="28">THE BUILT WORKFLOW / HUMAN SELECTION, PERSISTENT CONTEXT</text><rect class="node" x="32" y="80" width="220" height="88" rx="5"/><text class="heading" x="48" y="108">Brief + settings</text><text class="small" x="48" y="131">Next.js workspace</text><text class="small" x="48" y="150">Prompt, dimensions, models</text><rect class="node" x="310" y="80" width="224" height="88" rx="5"/><text class="heading" x="326" y="108">Comparison plan</text><text class="small" x="326" y="131">Assign models + dimensions</text><text class="small" x="326" y="150">Build each variation prompt</text><rect class="node" x="592" y="80" width="224" height="88" rx="5"/><text class="heading" x="608" y="108">Inngest jobs</text><text class="small" x="608" y="131">Fan out, retries, completion</text><text class="small" x="608" y="150">Track partial results</text><rect class="node" x="880" y="80" width="208" height="88" rx="5"/><text class="heading" x="896" y="108">Model adapters</text><text class="small" x="896" y="131">Replicate image models</text><text class="small" x="896" y="150">OpenAI prompt assistance</text><rect class="node" x="32" y="300" width="220" height="88" rx="5"/><text class="heading" x="48" y="328">A saved Pick</text><text class="small" x="48" y="351">Chosen output + context</text><text class="small" x="48" y="370">Human selection</text><rect class="node" x="310" y="300" width="224" height="88" rx="5"/><text class="heading" x="326" y="328">Comparison gallery</text><text class="small" x="326" y="351">See variations together</text><text class="small" x="326" y="370">Inspect prompt and settings</text><rect class="node" x="592" y="300" width="224" height="88" rx="5"/><text class="heading" x="608" y="328">PostgreSQL + Prisma</text><text class="small" x="608" y="351">Runs, nodes, variations</text><text class="small" x="608" y="370">Picks, branches, credits</text><rect class="node" x="880" y="300" width="208" height="88" rx="5"/><text class="heading" x="896" y="328">Cloudflare R2</text><text class="small" x="896" y="351">Generated artwork</text><text class="small" x="896" y="370">Persistent artifact URLs</text><rect class="node" x="310" y="515" width="224" height="88" rx="5"/><text class="heading" x="326" y="543">Next branch</text><text class="small" x="326" y="566">Parent image when supported</text><text class="small" x="326" y="585">Prompt + dimension context</text><path class="flow" d="M252 124H310"/><path class="flow" d="M534 124H592"/><path class="flow" d="M816 124H880"/><path class="flow" d="M704 168V300"/><text class="label" x="715" y="240">state and relationships</text><path class="flow" d="M984 168V300"/><text class="label" x="996" y="240">store output</text><path class="flow" d="M592 344H534"/><path class="flow" d="M310 344H252"/><path class="flow" d="M880 365H850V450H422V388"/><text class="label" x="599" y="440">load saved artifacts</text><path class="flow" d="M142 388V559H310"/><text class="label" x="152" y="548">branch from the Pick</text><path class="flow" d="M422 603V640H16V55H422V80"/><text class="label" x="310" y="46">new comparison</text><text class="small" x="615" y="533">Supporting services: Resend authentication, Stripe credits,</text><text class="small" x="615" y="555">Axiom logging, publishing and product event tracking.</text><text class="label" x="32" y="666">SIMPLIFIED RESPONSIBILITIES AND HANDOFFS · RECONSTRUCTED FROM SOURCE</text></svg>