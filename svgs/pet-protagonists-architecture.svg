<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">Pet Protagonists: the production system</title><desc id="desc">Next.js handles the customer flow and Stripe checkout. Inngest coordinates generation and printing workflows, PostgreSQL stores state, OpenAI and Replicate produce content, and R2 preserves images and PDFs. Email and Lulu provide delivery.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#cba575"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f3ecdf}.small{font-size:12px;fill:#b8aea0}.label{font-size:11px;fill:#d9b382}.heading{font-size:17px;font-weight:600}.node{fill:#2b251e;stroke:#62513f;stroke-width:1}.flow{fill:none;stroke:#cba575;stroke-width:1.6;marker-end:url(#arrow)}.return{stroke-dasharray:4 4}</style><rect width="1120" height="560" fill="#211d18"/><text class="label" x="32" y="28">CUSTOMER JOURNEY / GENERATION / DELIVERY</text><rect class="node" x="32" y="55" width="205" height="88" rx="5"/><text class="heading" x="49" y="83">Pet owner</text><text class="small" x="49" y="105">Photo, personality, setting</text><text class="small" x="49" y="122">Style and story preferences</text><rect class="node" x="318" y="55" width="240" height="88" rx="5"/><text class="heading" x="335" y="83">Next.js application</text><text class="small" x="335" y="105">Builder, preview, admin</text><text class="small" x="335" y="122">TypeScript on Railway</text><rect class="node" x="802" y="55" width="285" height="88" rx="5"/><text class="heading" x="819" y="83">Stripe</text><text class="small" x="819" y="105">Checkout and payment events</text><text class="small" x="819" y="122">Coupons and gift purchases</text><rect class="node" x="32" y="235" width="205" height="88" rx="5"/><text class="heading" x="49" y="263">PostgreSQL</text><text class="small" x="49" y="285">Orders, stories, scene state</text><text class="small" x="49" y="302">Prisma data model</text><rect class="node" x="318" y="235" width="240" height="88" rx="5" style="stroke:#d9b382;fill:#3b3022"/><text class="heading" x="335" y="263">Inngest workflows</text><text class="small" x="335" y="285">Saved steps, retries, concurrency</text><text class="small" x="335" y="302">Story, illustrations, book jobs</text><rect class="node" x="604" y="235" width="200" height="88" rx="5"/><text class="heading" x="621" y="263">Model services</text><text class="small" x="621" y="285">OpenAI: narrative + scenes</text><text class="small" x="621" y="302">Replicate: illustrations</text><rect class="node" x="851" y="235" width="236" height="88" rx="5"/><text class="heading" x="868" y="263">Cloudflare R2</text><text class="small" x="868" y="285">Photos, references, images</text><text class="small" x="868" y="302">Covers and interior PDFs</text><rect class="node" x="32" y="425" width="205" height="88" rx="5"/><text class="heading" x="49" y="453">Story delivery</text><text class="small" x="49" y="475">Hosted story + email link</text><text class="small" x="49" y="492">Mailgun</text><rect class="node" x="318" y="425" width="240" height="88" rx="5"/><text class="heading" x="335" y="453">Book preparation</text><text class="small" x="335" y="475">Sharp + PDFKit</text><text class="small" x="335" y="492">Preview and approval</text><rect class="node" x="604" y="425" width="200" height="88" rx="5"/><text class="heading" x="621" y="453">Print fulfillment</text><text class="small" x="621" y="475">Admin review → Lulu</text><text class="small" x="621" y="492">Print job + shipping status</text><path class="flow" d="M237 99H318"/><text class="label" x="260" y="88">create</text><path class="flow" d="M558 99H802"/><text class="label" x="645" y="86">checkout</text><path class="flow" d="M945 143V184H438V235"/><text class="label" x="620" y="174">payment confirmed / order event</text><path class="flow" d="M358 143V174H137V235"/><text class="label" x="155" y="165">read / write</text><path class="flow" d="M318 280H237"/><text class="label" x="239" y="268">save progress</text><path class="flow" d="M558 280H604"/><path class="flow" d="M804 280H851"/><path class="flow" d="M390 323V375H137V425"/><text class="label" x="163" y="365">completed story</text><path class="flow" d="M475 323V425"/><text class="label" x="486" y="382">book approved</text><path class="flow return" d="M851 302H829V391H541V425"/><text class="label" x="616" y="383">retrieve illustration assets</text><path class="flow" d="M558 469H604"/><text class="small" x="850" y="449">The output stays inspectable.</text><text class="small" x="850" y="471">Original PDFs and images are</text><text class="small" x="850" y="493">preserved with the case study.</text><text class="label" x="32" y="538">SIMPLIFIED RESPONSIBILITIES AND HANDOFFS · RECONSTRUCTED FROM SOURCE</text></svg>